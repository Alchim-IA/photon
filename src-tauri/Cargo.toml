[package]
name = "document-scanner"
version = "1.0.3"
description = "Scanner de Documents - Application de numérisation"
authors = ["you"]
edition = "2021"

[lib]
name = "document_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
image = "0.25"
dirs-next = "2"
base64 = "0.22"
printpdf = "0.7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tesseract = "0.14"
regex = "1"
lopdf = "0.34"
md5 = "0.7"
tiff = "0.9"
pdfium-render = { version = "0.8", default-features = false, features = ["image_025", "pdfium_latest", "thread_safe"] }
sha2 = "0.10"
flate2 = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
whatlang = "0.16"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
rxing = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Devices_ImageAcquisition",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Foundation",
    "implement",
] }
windows-core = "0.58"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.26"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# SANE via raw FFI - requires libsane-dev
