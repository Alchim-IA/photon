name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

  build:
    needs: check-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsane-dev \
            tesseract-ocr \
            libtesseract-dev \
            libleptonica-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install tesseract leptonica

      - name: Cache vcpkg packages
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-windows-tesseract-v1

      - name: Install Windows dependencies (vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          if ("${{ steps.vcpkg-cache.outputs.cache-hit }}" -ne "true") {
            & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install tesseract:x64-windows-static-md
          } else {
            Write-Host "Using cached vcpkg packages"
          }

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0
          releaseName: Photon v1.0.0
          releaseBody: |
            ## Photon v1.0.0

            Smart document scanner with AI-powered analysis, OCR, encrypted vault, and a glassmorphism interface.

            ### Features
            - Smart scanning (USB, eSCL network, batch)
            - OCR text recognition (50+ languages)
            - AI document classification (Groq)
            - Encrypted vault (AES-256)
            - Advanced PDF export (PDF/A, encryption, watermarks, signatures)
            - Automation rules
            - Table detection & CSV export
            - Sensitive data redaction
            - Multi-page document support
            - Light & dark glassmorphism themes

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `.dmg` |
            | macOS (Intel) | `.dmg` |
            | Windows | `.msi` / `.exe` |
            | Linux | `.deb` / `.rpm` / `.AppImage` |
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
