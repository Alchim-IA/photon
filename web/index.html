<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photon — Scanner intelligent</title>
  <meta name="description" content="Photon est un scanner de documents moderne avec IA, OCR, coffre-fort chiffre et une interface glassmorphism." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #080c18;
      --bg-surface: #0f1628;
      --glass-1: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.055);
      --glass-3: rgba(255,255,255,0.08);
      --glass-4: rgba(255,255,255,0.12);
      --glass-5: rgba(255,255,255,0.18);
      --glass-border-1: rgba(255,255,255,0.06);
      --glass-border-2: rgba(255,255,255,0.10);
      --glass-border-3: rgba(255,255,255,0.16);
      --accent: #22d3a7;
      --accent-light: #5eead4;
      --accent-dim: rgba(34,211,167,0.12);
      --accent-glow: rgba(34,211,167,0.35);
      --accent-2: #818cf8;
      --accent-3: #f472b6;
      --text-1: rgba(255,255,255,0.92);
      --text-2: rgba(255,255,255,0.58);
      --text-3: rgba(255,255,255,0.32);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.35);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.45);
      --shadow-xl: 0 16px 48px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 24px var(--accent-glow);
      --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-2xl: 24px;
      --ease-out: cubic-bezier(0.16,1,0.3,1);
      --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
      --dur-fast: 150ms; --dur-normal: 250ms; --dur-slow: 400ms; --dur-gentle: 600ms;
      --blur-sm: 8px; --blur-md: 16px; --blur-lg: 24px; --blur-xl: 40px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      color: var(--text-1);
    }

    body { background: var(--bg-deep); overflow-x: hidden; min-height: 100vh; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-border-3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

    .bg-orbs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg-orbs .orb { position: absolute; border-radius: 50%; filter: blur(80px); animation: orb-float 20s ease-in-out infinite; }
    .bg-orbs .orb:nth-child(1) { width: 600px; height: 600px; background: rgba(34,211,167,0.15); top: -10%; left: -5%; }
    .bg-orbs .orb:nth-child(2) { width: 500px; height: 500px; background: rgba(129,140,248,0.18); top: 30%; right: -10%; animation-delay: -7s; animation-duration: 25s; }
    .bg-orbs .orb:nth-child(3) { width: 400px; height: 400px; background: rgba(244,114,182,0.12); bottom: -5%; left: 30%; animation-delay: -14s; animation-duration: 22s; }
    .bg-orbs .orb:nth-child(4) { width: 300px; height: 300px; background: rgba(34,211,167,0.08); top: 60%; left: 10%; animation-delay: -5s; animation-duration: 28s; }
    @keyframes orb-float {
      0%, 100% { transform: translate(0,0) scale(1); }
      25% { transform: translate(60px,-40px) scale(1.1); }
      50% { transform: translate(-30px,60px) scale(0.95); }
      75% { transform: translate(40px,20px) scale(1.05); }
    }
    .mesh-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 70%);
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 16px 40px; display: flex; align-items: center; justify-content: space-between;
      background: var(--glass-1); backdrop-filter: blur(var(--blur-lg));
      border-bottom: 1px solid var(--glass-border-1);
      transition: background var(--dur-slow) var(--ease-out);
    }
    nav.scrolled { background: var(--glass-3); }
    .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-brand img { width: 36px; height: 36px; filter: drop-shadow(0 0 8px var(--accent-glow)); }
    .nav-brand span { font-size: 1.4rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    .nav-right { display: flex; align-items: center; gap: 24px; }
    .nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
    .nav-links a { color: var(--text-2); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: color var(--dur-fast); position: relative; }
    .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: var(--accent); border-radius: 1px; transition: width var(--dur-normal) var(--ease-out); }
    .nav-links a:hover { color: var(--text-1); }
    .nav-links a:hover::after { width: 100%; }

    .lang-switcher {
      display: flex; gap: 4px;
      background: var(--glass-2); border: 1px solid var(--glass-border-1);
      border-radius: 100px; padding: 3px; backdrop-filter: blur(var(--blur-sm));
    }
    .lang-btn {
      padding: 6px 14px; border: none; border-radius: 100px;
      background: transparent; color: var(--text-2); font-weight: 600; font-size: 0.85rem;
      cursor: pointer; transition: all var(--dur-fast) var(--ease-out); font-family: inherit;
    }
    .lang-btn.active { background: var(--accent); color: #080c18; }
    .lang-btn:not(.active):hover { color: var(--text-1); background: var(--glass-3); }

    .nav-cta {
      padding: 10px 24px; background: var(--accent); color: #080c18; border: none; border-radius: var(--r-md);
      font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all var(--dur-normal) var(--ease-out);
      text-decoration: none; box-shadow: var(--shadow-glow);
    }
    .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 0 36px var(--accent-glow), var(--shadow-md); }

    .hero {
      position: relative; z-index: 1; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 120px 24px 80px;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px;
      background: var(--glass-2); border: 1px solid var(--glass-border-2); border-radius: 100px;
      font-size: 0.85rem; font-weight: 500; color: var(--accent-light); margin-bottom: 32px;
      backdrop-filter: blur(var(--blur-sm)); animation: fade-up 0.8s var(--ease-out) both;
    }
    .hero-badge .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse-dot 2s ease-in-out infinite; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
    .hero h1 { font-size: clamp(3rem,7vw,5.5rem); font-weight: 800; letter-spacing: -2px; line-height: 1.05; margin-bottom: 24px; animation: fade-up 0.8s var(--ease-out) 0.1s both; }
    .hero h1 .gradient { background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-sub { font-size: 1.25rem; color: var(--text-2); max-width: 600px; margin-bottom: 48px; font-weight: 400; animation: fade-up 0.8s var(--ease-out) 0.2s both; }
    .hero-actions { display: flex; gap: 16px; animation: fade-up 0.8s var(--ease-out) 0.3s both; }
    .btn-primary { padding: 14px 36px; background: var(--accent); color: #080c18; border: none; border-radius: var(--r-md); font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: all var(--dur-normal) var(--ease-out); text-decoration: none; box-shadow: var(--shadow-glow); font-family: inherit; }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 0 48px var(--accent-glow), var(--shadow-lg); }
    .btn-secondary { padding: 14px 36px; background: var(--glass-2); color: var(--text-1); border: 1px solid var(--glass-border-2); border-radius: var(--r-md); font-weight: 600; font-size: 1.05rem; cursor: pointer; transition: all var(--dur-normal) var(--ease-out); text-decoration: none; backdrop-filter: blur(var(--blur-sm)); font-family: inherit; }
    .btn-secondary:hover { background: var(--glass-3); border-color: var(--glass-border-3); transform: translateY(-2px); }
    .hero-screenshot { margin-top: 64px; width: 100%; max-width: 1100px; animation: fade-up 1s var(--ease-out) 0.5s both; }
    .screenshot-frame { position: relative; border-radius: var(--r-2xl); overflow: hidden; border: 1px solid var(--glass-border-2); box-shadow: var(--shadow-xl), 0 0 80px rgba(34,211,167,0.08); background: var(--glass-1); backdrop-filter: blur(var(--blur-md)); }
    .screenshot-frame::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, var(--bg-deep) 100%); z-index: 2; pointer-events: none; }
    .screenshot-frame img { width: 100%; display: block; }
    .screenshot-glow { position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%); width: 60%; height: 120px; background: var(--accent-glow); filter: blur(60px); border-radius: 50%; z-index: -1; }

    section { position: relative; z-index: 1; padding: 120px 24px; }
    .section-inner { max-width: 1200px; margin: 0 auto; }
    .section-label { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
    .section-label::before { content: ''; width: 24px; height: 2px; background: var(--accent); border-radius: 1px; }
    .section-title { font-size: clamp(2rem,4vw,3rem); font-weight: 700; letter-spacing: -1px; margin-bottom: 16px; }
    .section-desc { font-size: 1.1rem; color: var(--text-2); max-width: 600px; margin-bottom: 64px; }

    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
    .feature-card { position: relative; padding: 36px 32px; background: var(--glass-1); border: 1px solid var(--glass-border-1); border-radius: var(--r-xl); backdrop-filter: blur(var(--blur-md)); transition: all var(--dur-normal) var(--ease-out); overflow: hidden; }
    .feature-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0; transition: opacity var(--dur-normal); }
    .feature-card:hover { background: var(--glass-2); border-color: var(--glass-border-2); transform: translateY(-4px); box-shadow: var(--shadow-lg), 0 0 40px rgba(34,211,167,0.04); }
    .feature-card:hover::before { opacity: 1; }
    .feature-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-md); margin-bottom: 20px; }
    .feature-icon.teal { background: rgba(34,211,167,0.12); color: var(--accent); }
    .feature-icon.indigo { background: rgba(129,140,248,0.12); color: var(--accent-2); }
    .feature-icon.pink { background: rgba(244,114,182,0.12); color: var(--accent-3); }
    .feature-card h3 { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; }
    .feature-card p { font-size: 0.95rem; color: var(--text-2); line-height: 1.6; }

    .showcase { text-align: center; }
    .showcase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 32px; margin-top: 48px; }
    .showcase-item { position: relative; border-radius: var(--r-xl); overflow: hidden; border: 1px solid var(--glass-border-1); background: var(--glass-1); backdrop-filter: blur(var(--blur-sm)); transition: all var(--dur-normal) var(--ease-out); }
    .showcase-item:hover { border-color: var(--glass-border-2); transform: translateY(-6px) scale(1.01); box-shadow: var(--shadow-xl); }
    .showcase-item img { width: 100%; display: block; }
    .showcase-item .caption { padding: 20px 24px; text-align: left; }
    .showcase-item .caption h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
    .showcase-item .caption p { font-size: 0.9rem; color: var(--text-2); }

    .stats-bar { display: flex; justify-content: center; gap: 64px; flex-wrap: wrap; padding: 80px 24px; position: relative; z-index: 1; }
    .stat-item { text-align: center; }
    .stat-value { font-size: 3rem; font-weight: 800; letter-spacing: -2px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-label { font-size: 0.95rem; color: var(--text-2); margin-top: 4px; }

    .tech-row { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; }
    .tech-chip { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: var(--glass-2); border: 1px solid var(--glass-border-1); border-radius: 100px; font-size: 0.9rem; font-weight: 500; color: var(--text-2); backdrop-filter: blur(var(--blur-sm)); transition: all var(--dur-normal) var(--ease-out); }
    .tech-chip:hover { background: var(--glass-3); border-color: var(--glass-border-2); color: var(--text-1); transform: translateY(-2px); }
    .tech-chip svg { width: 20px; height: 20px; }

    .cta-section { text-align: center; padding: 120px 24px; }
    .cta-card { max-width: 700px; margin: 0 auto; padding: 64px 48px; background: var(--glass-2); border: 1px solid var(--glass-border-2); border-radius: var(--r-2xl); backdrop-filter: blur(var(--blur-lg)); position: relative; overflow: hidden; }
    .cta-card::before { content: ''; position: absolute; top: -1px; left: 20%; right: 20%; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent); }
    .cta-card h2 { font-size: 2.2rem; font-weight: 700; margin-bottom: 16px; }
    .cta-card p { color: var(--text-2); font-size: 1.1rem; margin-bottom: 36px; }
    .cta-platforms { display: flex; justify-content: center; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
    .platform-btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; background: var(--glass-3); border: 1px solid var(--glass-border-2); border-radius: var(--r-md); color: var(--text-1); font-weight: 600; font-size: 1rem; cursor: pointer; transition: all var(--dur-normal) var(--ease-out); text-decoration: none; font-family: inherit; }
    .platform-btn:hover { background: var(--glass-4); border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-glow); }
    .platform-btn svg { width: 22px; height: 22px; }

    footer { position: relative; z-index: 1; padding: 40px 24px; text-align: center; border-top: 1px solid var(--glass-border-1); }
    footer p { color: var(--text-3); font-size: 0.9rem; }
    footer a { color: var(--accent); text-decoration: none; }

    @keyframes fade-up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out); }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-stagger > * { opacity: 0; transform: translateY(30px); transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out); }
    .reveal-stagger.visible > *:nth-child(1) { transition-delay: 0s; }
    .reveal-stagger.visible > *:nth-child(2) { transition-delay: 0.08s; }
    .reveal-stagger.visible > *:nth-child(3) { transition-delay: 0.16s; }
    .reveal-stagger.visible > *:nth-child(4) { transition-delay: 0.24s; }
    .reveal-stagger.visible > *:nth-child(5) { transition-delay: 0.32s; }
    .reveal-stagger.visible > *:nth-child(6) { transition-delay: 0.40s; }
    .reveal-stagger.visible > *:nth-child(7) { transition-delay: 0.48s; }
    .reveal-stagger.visible > *:nth-child(8) { transition-delay: 0.56s; }
    .reveal-stagger.visible > *:nth-child(9) { transition-delay: 0.64s; }
    .reveal-stagger.visible > * { opacity: 1; transform: translateY(0); }
    .scan-line-anim { position: absolute; left: 5%; right: 5%; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); box-shadow: 0 0 20px var(--accent-glow); animation: scan-sweep 3s ease-in-out infinite; z-index: 3; border-radius: 1px; }
    @keyframes scan-sweep { 0% { top: 10%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 85%; opacity: 0; } }

    @media (max-width: 768px) {
      nav { padding: 12px 20px; }
      .nav-links { display: none; }
      .hero { padding: 100px 20px 60px; }
      .features-grid { grid-template-columns: 1fr; }
      .showcase-grid { grid-template-columns: 1fr; }
      .stats-bar { gap: 32px; }
      .stat-value { font-size: 2.2rem; }
      .cta-card { padding: 40px 24px; }
      .hero-actions { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <div class="bg-orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
  <div class="mesh-grid"></div>

  <nav id="nav">
    <a class="nav-brand" href="#">
      <img src="logo.png" alt="Photon" />
      <span>Photon</span>
    </a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="#features" data-i18n="nav.features"></a></li>
        <li><a href="#showcase" data-i18n="nav.screenshots"></a></li>
        <li><a href="#tech" data-i18n="nav.tech"></a></li>
      </ul>
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <a class="nav-cta" href="https://github.com/Alchim-IA/photon/releases/download/v1.0.0/Photon_1.0.0_aarch64.dmg" download data-i18n="nav.download"></a>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-badge">
      <span class="dot"></span>
      <span data-i18n="hero.badge"></span>
    </div>
    <!-- Hero title: two spans toggled by JS, no innerHTML needed -->
    <h1>
      <span data-i18n="hero.title.line1"></span><br/>
      <span data-i18n="hero.title.line2"></span> <span class="gradient">Photon</span>
    </h1>
    <p class="hero-sub" data-i18n="hero.sub"></p>
    <div class="hero-actions">
      <a class="btn-primary" href="https://github.com/Alchim-IA/photon/releases/download/v1.0.0/Photon_1.0.0_aarch64.dmg" download data-i18n="hero.download"></a>
      <a class="btn-secondary" href="https://github.com/Alchim-IA/photon" target="_blank" rel="noopener">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:6px;"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        <span data-i18n="hero.github"></span>
      </a>
    </div>
    <div class="hero-screenshot">
      <div class="screenshot-frame">
        <div class="scan-line-anim"></div>
        <img src="dark-mode.png" alt="Photon interface" loading="lazy" />
      </div>
      <div class="screenshot-glow"></div>
    </div>
  </section>

  <div class="stats-bar reveal">
    <div class="stat-item"><div class="stat-value" data-target="12">0</div><div class="stat-label" data-i18n="stats.types"></div></div>
    <div class="stat-item"><div class="stat-value" data-target="50">0</div><div class="stat-label" data-i18n="stats.languages"></div></div>
    <div class="stat-item"><div class="stat-value" data-target="3">0</div><div class="stat-label" data-i18n="stats.modes"></div></div>
    <div class="stat-item"><div class="stat-value">100%</div><div class="stat-label" data-i18n="stats.opensource"></div></div>
  </div>

  <section id="features">
    <div class="section-inner">
      <div class="section-label" data-i18n="features.label"></div>
      <h2 class="section-title reveal" data-i18n="features.title"></h2>
      <p class="section-desc reveal" data-i18n="features.desc"></p>

        "_title": "Photon \u2014 Smart Document Scanner",
        "_desc": "Photon is a modern, AI-powered document scanner for macOS and Windows. Glassmorphism UI, OCR, vault, automation rules, and more."
      }
    };

    let lang = localStorage.getItem('photon-lang') || (navigator.language.startsWith('fr') ? 'fr' : 'en');

    function setLang(l) {
      lang = l;
      localStorage.setItem('photon-lang', l);
      document.documentElement.lang = l;
      var t = T[l];
      document.title = t['_title'];
      document.querySelector('meta[name="description"]').setAttribute('content', t['_desc']);
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        if (t[key] != null) el.textContent = t[key];
      });
      document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.lang === l);
      });
    }

    setLang(lang);
    document.querySelectorAll('.lang-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { setLang(btn.dataset.lang); });
    });

    // Scroll reveal
    var reveals = document.querySelectorAll('.reveal, .reveal-stagger');
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    reveals.forEach(function(el) { obs.observe(el); });

    // Nav scroll
    var navEl = document.getElementById('nav');
    window.addEventListener('scroll', function() { navEl.classList.toggle('scrolled', window.scrollY > 40); }, { passive: true });

    // Counter animation
    var counters = document.querySelectorAll('.stat-value[data-target]');
    var cObs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) {
          var el = e.target;
          var target = parseInt(el.dataset.target);
          var current = 0;
          var step = Math.max(1, Math.floor(target / 40));
          var timer = setInterval(function() {
            current += step;
            if (current >= target) { current = target; clearInterval(timer); }
            el.textContent = current + '+';
          }, 30);
          cObs.unobserve(el);
        }
      });
    }, { threshold: 0.5 });
    counters.forEach(function(el) { cObs.observe(el); });

    // Smooth scroll
    document.querySelectorAll('a[href^="#"]').forEach(function(a) {
      a.addEventListener('click', function(e) {
        e.preventDefault();
        var target = document.querySelector(a.getAttribute('href'));
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  </script>

</body>
</html>
